<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boocs</title>
<style>body{margin:0;font-family:Inter,system-ui;background:#0f1218;color:#eef2ff}#app{display:grid;grid-template-rows:56px 1fr 58px;height:100vh}.top,.nav{display:flex;align-items:center;padding:0 12px;background:#151a22}.top{justify-content:space-between;border-bottom:1px solid #232b38}.nav{justify-content:space-around;border-top:1px solid #232b38}.screen{display:none;height:100%;overflow:auto}.screen.active{display:block}.card{background:#171f2a;border:1px solid #283142;border-radius:12px;padding:10px;margin:10px}.row{display:flex;gap:8px}.row>*{flex:1}input,select,button,textarea{background:#111722;border:1px solid #2a3547;color:#eef2ff;border-radius:10px;padding:10px}button{cursor:pointer;background:#3d72ff;border:0}.list .item{padding:10px;border-bottom:1px solid #242d3d;cursor:pointer}.msg{padding:8px 10px;margin:6px;border-radius:10px;background:#202839;max-width:75%}.me{margin-left:auto;background:#3156a8}.tiny{font-size:12px;color:#a7b3cc}.badge{font-size:11px;padding:3px 7px;background:#25324a;border-radius:999px}</style></head><body><div id="app">
<div class="top"><b>Boocs</b><span id="userState" class="tiny">guest</span></div>
<div id="chats" class="screen active"><div class="card" id="authCard"></div><div class="card row"><input id="chatSearch" placeholder="Поиск чатов"><button id="newChat">+ Чат</button></div><div class="card list" id="chatList"></div><div class="card" id="chatView"></div></div>
<div id="services" class="screen"><div class="card"><b>Музыка</b><div class="row"><input id="musicQ" placeholder="Поиск трека"><button id="musicFind">Найти</button></div><div id="musicList"></div></div><div class="card"><b>Такси</b><div class="row"><input id="from" placeholder="A"><input id="to" placeholder="B"></div><div class="row"><select id="tariff"><option>econom</option><option>comfort</option><option>business</option></select><button id="orderTaxi">Заказать</button></div><div id="taxiOut" class="tiny"></div></div><div class="card"><b>Транспорт/Метро</b><div class="row"><input id="mFrom" placeholder="Откуда"><input id="mTo" placeholder="Куда"><button id="buildMetro">Маршрут</button></div><div id="metroOut" class="tiny"></div></div><div class="card"><b>Госуслуги</b><button id="govLoad">Загрузить профиль</button><div id="govOut" class="tiny"></div></div></div>
<div id="calls" class="screen"><div class="card"><b>Звонки</b><div class="row"><select id="callType"><option>audio</option><option>video</option></select><button id="startCall">Старт</button><button id="endCall">Завершить</button></div><div class="row"><button id="mute">Mute</button><button id="cam">Cam</button><button id="switchCam">Switch Cam</button><button id="recCall">Rec</button></div><div id="callState" class="tiny"></div></div><div class="card"><b>Видео кружки/фигуры</b><div class="row"><select id="shape"><option>circle</option><option>square</option><option>triangle</option></select><button id="videoStart">Запись</button><button id="videoStop">Стоп+Отправка</button></div><video id="preview" autoplay muted style="width:100%;max-height:180px;border-radius:12px;background:#000"></video></div><div class="card"><b>Голосовые</b><div class="tiny">Удерживай кнопку: вверх=lock, влево=cancel</div><button id="holdRec">🎤 Hold to record</button><div class="row"><button id="play1">1x</button><button id="play15">1.5x</button><button id="play2">2x</button></div><audio id="voice" controls style="width:100%"></audio></div></div>
<div id="settings" class="screen"><div class="card"><b>Настройки</b><div class="row"><input id="pin" placeholder="PIN"><button id="savePin">Сохранить PIN</button></div><div class="row"><select id="theme"><option>dark</option><option>light</option></select><input id="accent" type="color" value="#3d72ff"><button id="applyTheme">Применить</button></div><div class="row"><button id="togglePreview">Preview уведомлений</button><button id="toggleSounds">Звуки</button></div><div id="settingsOut" class="tiny"></div></div></div>
<div class="nav"><button data-s="chats">Чаты</button><button data-s="services">Сервисы</button><button data-s="calls">Звонки</button><button data-s="settings">Настройки</button></div></div>
<script>
const S={users:JSON.parse(localStorage.u||'[]'),session:JSON.parse(localStorage.s||'null'),chats:JSON.parse(localStorage.c||'[{"id":"c1","title":"Личка","type":"private","messages":[]}]'),calls:null,music:[{id:'1',t:'Night Drive'},{id:'2',t:'Metro Wave'}],gov:{docs:[{id:'passport',status:'valid'}],fines:[{id:'f1',amount:1200,paid:false}],taxes:[{id:'t1',amount:5300,paid:false}]},settings:JSON.parse(localStorage.st||'{"theme":"dark","accent":"#3d72ff","preview":true,"sounds":true}')};
const save=()=>{localStorage.u=JSON.stringify(S.users);localStorage.s=JSON.stringify(S.session);localStorage.c=JSON.stringify(S.chats);localStorage.st=JSON.stringify(S.settings)};
class AuthService{register(v){if(S.users.find(x=>x.email===v.email||x.phone===v.phone))throw Error('exists');const u={id:crypto.randomUUID(),...v};S.users.push(u);S.session={uid:u.id,token:crypto.randomUUID()};save()}login(v){const u=S.users.find(x=>(x.email===v.login||x.phone===v.login)&&x.pass===v.pass);if(!u)throw Error('bad');S.session={uid:u.id,token:crypto.randomUUID()};save()}recover(login,code,np){const u=S.users.find(x=>x.email===login||x.phone===login);if(!u||code!=='123456')throw Error('bad code');u.pass=np;save()}}
class MessageService{send(cid,text,kind='text',extra={}){const c=S.chats.find(x=>x.id===cid);c.messages.push({id:crypto.randomUUID(),me:true,text,kind,extra,at:Date.now()});save()}list(cid){return S.chats.find(x=>x.id===cid).messages}}
class CallService{start(type){S.calls={id:crypto.randomUUID(),type,mute:false,cam:type==='video',camera:'front',rec:false,active:true};return S.calls}toggle(k){S.calls[k]=!S.calls[k];return S.calls}switchCam(){S.calls.camera=S.calls.camera==='front'?'back':'front';return S.calls}end(){if(S.calls)S.calls.active=false;return S.calls}}
class TaxiService{order(a,b,t){const km=Math.max(2,Math.floor(Math.random()*20));const p=(t==='business'?12:t==='comfort'?8:5)*km;return {a,b,t,km,price:p,eta:Math.round(km*1.3)}}}
class MusicService{search(q){return S.music.filter(x=>x.t.toLowerCase().includes(q.toLowerCase()))}}
class GeoService{route(a,b){return {a,b,lines:['Blue','Red'],eta:12+Math.floor(Math.random()*8)}}}
class GovService{profile(){return S.gov}pay(type,id){const e=S.gov[type].find(x=>x.id===id);e.paid=true;return e}}
const auth=new AuthService(),msg=new MessageService(),call=new CallService(),taxi=new TaxiService(),music=new MusicService(),geo=new GeoService(),gov=new GovService();
let active='c1';
function rAuth(){authCard.innerHTML=S.session?`<div class=tiny>Вход выполнен (${S.session.uid.slice(0,6)})</div><button onclick="S.session=null;save();render()">Выйти</button>`:`<div class=row><input id=login placeholder='email/phone'><input id=pass type=password placeholder='pass'><button id=btnLogin>Войти</button></div><div class=row><input id=email placeholder='email'><input id=phone placeholder='phone'></div><div class=row><input id=pass2 type=password placeholder='pass'><button id=btnReg>Регистрация</button></div><div class=row><input id=recl placeholder='email/phone'><input id=recc placeholder='код 123456'><input id=recp placeholder='new pass'><button id=btnRec>Реанимация</button></div>`;if(!S.session){btnLogin.onclick=()=>{try{auth.login({login:login.value,pass:pass.value});render()}catch(e){alert(e.message)}};btnReg.onclick=()=>{try{auth.register({email:email.value,phone:phone.value,pass:pass2.value});render()}catch(e){alert(e.message)}};btnRec.onclick=()=>{try{auth.recover(recl.value,recc.value,recp.value);alert('восстановлено')}catch(e){alert(e.message)}}}}
function rChats(){chatList.innerHTML=S.chats.filter(c=>c.title.toLowerCase().includes(chatSearch.value.toLowerCase())).map(c=>`<div class='item' onclick="active='${c.id}';render()">${c.title} <span class=badge>${c.type}</span></div>`).join('');const m=msg.list(active)||[];chatView.innerHTML=`<div id=ms>${m.map(x=>`<div class='msg ${x.me?'me':''}'>${x.text}<div class=tiny>${x.kind}</div></div>`).join('')}</div><div class=row><textarea id=mtxt placeholder='Текст/ссылка' rows=2></textarea><button id=sendMsg>Send</button></div><div class=row><button id=sendPhoto>Фото</button><button id=sendVideo>Видео</button><button id=sendFile>Файл</button><button id=sendMusic>Музыка</button></div>`;sendMsg.onclick=()=>{msg.send(active,mtxt.value);render()};sendPhoto.onclick=()=>{msg.send(active,'photo.jpg','photo')||render()};sendVideo.onclick=()=>{msg.send(active,'video.mp4','video')||render()};sendFile.onclick=()=>{msg.send(active,'doc.pdf','file')||render()};sendMusic.onclick=()=>{msg.send(active,'Night Drive','music')||render()}}
newChat.onclick=()=>{S.chats.push({id:crypto.randomUUID(),title:'Новый чат '+(S.chats.length+1),type:['private','group','channel'][S.chats.length%3],messages:[]});save();render()};
musicFind.onclick=()=>{const rows=music.search(musicQ.value);musicList.innerHTML='';rows.forEach(x=>{const d=document.createElement('div');d.className='item';const b=document.createElement('button');b.textContent='В чат';b.onclick=()=>{msg.send(active,x.t,'music');render()};d.textContent=x.t+' ';d.appendChild(b);musicList.appendChild(d);});};
orderTaxi.onclick=()=>{const o=taxi.order(from.value,to.value,tariff.value);taxiOut.textContent=`${o.a}→${o.b}, ${o.km}km, ${o.price}₽, ETA ${o.eta}m`};
buildMetro.onclick=()=>{const r=geo.route(mFrom.value,mTo.value);metroOut.textContent=`${r.a}→${r.b}, линии ${r.lines.join(', ')}, ${r.eta} мин`};
govLoad.onclick=()=>{const p=gov.profile();govOut.textContent=JSON.stringify(p)};
startCall.onclick=()=>{call.start(callType.value);callState.textContent=JSON.stringify(S.calls)};endCall.onclick=()=>{call.end();callState.textContent=JSON.stringify(S.calls)};mute.onclick=()=>{call.toggle('mute');callState.textContent=JSON.stringify(S.calls)};cam.onclick=()=>{call.toggle('cam');callState.textContent=JSON.stringify(S.calls)};switchCam.onclick=()=>{call.switchCam();callState.textContent=JSON.stringify(S.calls)};recCall.onclick=()=>{call.toggle('rec');callState.textContent=JSON.stringify(S.calls)};
let vStream,vRec,vChunks=[];videoStart.onclick=async()=>{vStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});preview.srcObject=vStream;vRec=new MediaRecorder(vStream);vChunks=[];vRec.ondataavailable=e=>vChunks.push(e.data);vRec.start()};videoStop.onclick=()=>{if(vRec){vRec.onstop=()=>{msg.send(active,'video-note','video_note',{shape:shape.value,size:vChunks.reduce((a,b)=>a+b.size,0)});render()};vRec.stop();vStream.getTracks().forEach(t=>t.stop())}};
let rec,recChunks=[],locked=false,startX=0,startY=0;
holdRec.onpointerdown=async(e)=>{startX=e.clientX;startY=e.clientY;locked=false;const s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);recChunks=[];rec.ondataavailable=x=>recChunks.push(x.data);rec.start();holdRec.textContent='REC...'};
holdRec.onpointermove=(e)=>{if(!rec)return; if(e.clientY<startY-40){locked=true;holdRec.textContent='LOCKED'} if(e.clientX<startX-60){rec.stop();rec.stream.getTracks().forEach(t=>t.stop());rec=null;holdRec.textContent='CANCEL';}};
holdRec.onpointerup=()=>{if(!rec)return; rec.onstop=()=>{const blob=new Blob(recChunks,{type:'audio/webm'});voice.src=URL.createObjectURL(blob);msg.send(active,'voice','voice',{size:blob.size});render()};rec.stop();rec.stream.getTracks().forEach(t=>t.stop());rec=null;holdRec.textContent=locked?'SAVED LOCK':'🎤 Hold to record';};
play1.onclick=()=>voice.playbackRate=1;play15.onclick=()=>voice.playbackRate=1.5;play2.onclick=()=>voice.playbackRate=2;
savePin.onclick=()=>{localStorage.pin=pin.value;settingsOut.textContent='PIN сохранён'};applyTheme.onclick=()=>{S.settings.theme=theme.value;S.settings.accent=accent.value;document.documentElement.style.setProperty('--accent',accent.value);document.body.style.background=theme.value==='light'?'#e9edf7':'#0f1218';save()};togglePreview.onclick=()=>{S.settings.preview=!S.settings.preview;save();settingsOut.textContent='preview: '+S.settings.preview};toggleSounds.onclick=()=>{S.settings.sounds=!S.settings.sounds;save();settingsOut.textContent='sounds: '+S.settings.sounds};
for(const b of document.querySelectorAll('.nav button'))b.onclick=()=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(b.dataset.s).classList.add('active')};
function render(){userState.textContent=S.session?'online':'guest';rAuth();rChats();save()} render();
</script></body></html>
